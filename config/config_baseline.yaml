# Baseline Configuration (Similar to Fall Project)
# For comparison purposes

experiment:
  name: "lung_cancer_baseline"
  description: "Baseline 3D U-Net (similar to Fall project)"
  seed: 42
  use_gpu: true
  gpu_id: 0
  mixed_precision: false

data:
  base_dir: "d:/Spring project/dataset/LIDC"
  ct_dir: "d:/Spring project/dataset/LIDC/ct/LIDC-exact/ct"
  mask_dir: "d:/Spring project/dataset/LIDC/mask/masks"
  manifest_dir: "d:/Spring project/dataset/LIDC/manifests/LIDC-clean"
  train_manifest: "d:/Spring project/dataset/LIDC/manifests/LIDC-clean/train_manifest.csv"
  val_manifest: "d:/Spring project/dataset/LIDC/manifests/LIDC-clean/val_manifest.csv"

preprocessing:
  spacing: [1.5, 1.5, 2.0]
  orientation: "RAS"
  intensity_clip: [-1000, 400]
  normalize: true
  crop_foreground: true
  patch_size: [96, 96, 96]  # Original size

augmentation:
  enabled: true
  random_flip_prob: 0.5
  random_rotate_prob: 0.5
  random_rotate_range: [-10, 10]
  random_scale_prob: 0.0
  elastic_deform_prob: 0.0
  gaussian_noise_prob: 0.0
  gaussian_smooth_prob: 0.0
  intensity_shift_prob: 0.0
  intensity_scale_prob: 0.0

sampling:
  positive_negative_ratio: 1.0
  samples_per_volume: 2
  hard_negative_mining: false

model:
  name: "UNet3D"
  spatial_dims: 3
  in_channels: 1
  out_channels: 2
  channels: [16, 32, 64, 128, 256]  # Original channels
  strides: [2, 2, 2, 2]
  num_res_units: 2
  norm: "BATCH"
  dropout: 0.0
  use_attention: false
  deep_supervision: false

loss:
  type: "dice_ce"
  dice_loss_weight: 0.5
  ce_loss_weight: 0.5

training:
  epochs: 50
  batch_size: 2
  gradient_accumulation_steps: 1
  optimizer: "Adam"
  learning_rate: 1e-4
  weight_decay: 0.0
  scheduler: "reduce_on_plateau"
  lr_patience: 5
  lr_factor: 0.5
  early_stopping: false

validation:
  val_interval: 1
  val_batch_size: 1
  save_predictions: true
  num_samples_to_save: 3

checkpoint:
  save_interval: 10
  save_best_only: false
  monitor_metric: "val_dice"
  mode: "max"

logging:
  use_tensorboard: true
  tensorboard_dir: "experiments/runs"
  log_interval: 10
  use_wandb: false

metrics:
  primary: "dice"
  compute_all: true
  metrics_list:
    - "dice"
    - "iou"

inference:
  sliding_window_size: [96, 96, 96]
  sliding_window_overlap: 0.5
  use_gaussian_importance: false
  post_processing:
    enabled: false
